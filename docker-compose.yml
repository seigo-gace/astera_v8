services:
  astera-v8:
    build: .
    container_name: astera-v8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASTERA_HOST: 127.0.0.1
      ASTERA_PORT: 7373
      ASTERA_DB: /data/astera.db
      ASTERA_LOG_CACHE_DIR: /cache/outbox
      ASTERA_TGS_URL: http://127.0.0.1:3000/ingest
      ASTERA_TGS_PROJECT_ID: P002
    # TGserver binds only to host loopback. Host networking keeps both private
    # and lets Astera deliver structured logs directly to it.
    network_mode: host
    volumes:
      - astera-data:/data
      - /home/admin1/logs/astera-v8:/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7373/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  astera-v8-cloudflared:
    image: cloudflare/cloudflared:2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    profiles:
      - cloudflare
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    depends_on:
      astera-v8:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/astera_v8_cloudflare_tunnel_token
    secrets:
      - astera_v8_cloudflare_tunnel_token

volumes:
  astera-data:

secrets:
  astera_v8_cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-/dev/null}
