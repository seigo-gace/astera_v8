name: Dispatch one-time Astera Drive replacement

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == 'RUN_ASTERA_DRIVE_REPLACE'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch replacement workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/drive-full-replace.yml/dispatches" \
            --data '{"ref":"main"}'
