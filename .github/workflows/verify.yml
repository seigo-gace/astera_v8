name: Astera Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check active JavaScript syntax
        run: npm run check:syntax

      - name: Check active JSON
        run: npm run check:json

      - name: Check shell syntax
        run: npm run check:shell

      - name: Test Initial Fast Path
        run: node --test test/initial-material-fast-path.test.js

      - name: Test Progressive HTTP
        run: node --test test/progressive-http-api.test.js

      - name: Test Evidence Dual Route Contract
        run: node --test test/evidence-search-dual-route-contract.test.js

      - name: Test Evidence Core
        run: node --test test/evidence-search-core.test.js

      - name: Test Evidence Adoption Boundary
        run: node --test test/evidence-search-adopted-evidence-boundary.test.js

      - name: Test Evidence user journey
        run: npm run test:evidence-user

      - name: Test Evidence API
        run: npm run test:evidence-api

      - name: Test Evidence main proxy
        run: npm run test:evidence-main

      - name: Test Evidence provider adapters
        run: npm run test:evidence-provider-adapter

      - name: Test Evidence specialist expansion
        run: npm run test:evidence-specialist-expansion

      - name: Test Evidence evaluator integration
        run: npm run test:evidence-evaluator

      - name: Test Evidence recovery
        run: npm run test:evidence-recovery

      - name: Test Evidence projection index
        run: npm run test:evidence-projection

      - name: Test Evidence modular architecture
        run: npm run test:evidence-architecture

      - name: Test public API
        run: node --test test/api.test.js

      - name: Run remaining runtime tests
        run: npm run test:runtime

      - name: Run evaluator tests
        run: npm run test:evaluator

      - name: Run evaluator API tests
        run: npm run test:evaluator-api

      - name: Validate Evidence Search architecture
        run: npm run validate:evidence-architecture

      - name: Build real Japanese Parser HTTP runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/seigo-gace/Deterministic-Japanese-Parser-MCP.git /tmp/djpmcp-http-src
          cd /tmp/djpmcp-http-src
          git fetch --depth 1 origin 42e3b0ac128932d3ddc23e39d708dfd8f0773d03
          git checkout --detach 42e3b0ac128932d3ddc23e39d708dfd8f0773d03
          docker build -f Dockerfile.http -t djpmcp-http-ci .
          docker run -d --rm \
            --name djpmcp-http-ci \
            -p 127.0.0.1:8765:8765 \
            -e DJPMCP_HTTP_API_KEY=ci-only-key \
            -e DJPMCP_HTTP_ALLOWED_HOSTS=127.0.0.1:8765,localhost:8765 \
            djpmcp-http-ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs djpmcp-http-ci
          exit 1

      - name: Run real HTTP smoke verification
        env:
          ASTERA_JAPANESE_PARSER_MODE: http
          ASTERA_JAPANESE_PARSER_URL: http://127.0.0.1:8765/v1/analyze
          ASTERA_JAPANESE_PARSER_API_KEY: ci-only-key
        run: npm run verify:http-e2e

      - name: Stop Japanese Parser HTTP runtime
        if: always()
        run: docker rm -f djpmcp-http-ci >/dev/null 2>&1 || true
