name: Patch and dispatch Astera Drive replacement

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: read

jobs:
  patch-and-dispatch:
    if: github.event.issue.title == 'RUN_ASTERA_DRIVE_REPLACE_V2'
    runs-on: ubuntu-latest
    steps:
      - name: Allow workflow dispatch actor and start replacement
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          path = '.github/workflows/drive-full-replace.yml'
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          meta = call('GET', f'{api}/contents/{path}?ref=main')
          text = base64.b64decode(meta['content']).decode('utf-8')
          old = "if: github.actor != 'github-actions[bot]'"
          new = "if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'"
          if old in text:
              text = text.replace(old, new, 1)
              call('PUT', f'{api}/contents/{path}', {
                  'message': 'fix: allow API-dispatched replacement run',
                  'content': base64.b64encode(text.encode()).decode(),
                  'sha': meta['sha'],
                  'branch': 'main',
              })
          elif new not in text:
              raise SystemExit('Expected workflow condition was not found')

          call('POST', f'{api}/actions/workflows/drive-full-replace.yml/dispatches', {'ref': 'main'})
          PY
