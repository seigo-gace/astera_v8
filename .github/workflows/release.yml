name: Astera Release Verify

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hermetic verify (source + unit tests)
        run: npm run verify:source

      - name: REAL MCP gate
        env:
          ASTERA_JAPANESE_PARSER_COMMAND: ${{ secrets.ASTERA_JAPANESE_PARSER_COMMAND }}
        run: node scripts/run-real-mcp-gate.js

      - name: HTTP Main8 E2E smoke
        run: bash scripts/smoke.sh
