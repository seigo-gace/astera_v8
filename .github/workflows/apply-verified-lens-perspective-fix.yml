name: Apply verified judgment-material fixes

on:
  push:
    branches:
      - feature/evidence-search-v2-4
    paths:
      - .github/workflows/apply-verified-lens-perspective-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply verified judgment-material fixes'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/evidence-search-v2-4
          fetch-depth: 2

      - name: Verify locked parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c3ce277da33caa64b6c6303c3ae880f7e9c3a28a"

      - name: Apply exact verified judgment-material patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/jm-fix.patch
          git apply --check /tmp/jm-fix.patch
          git apply /tmp/jm-fix.patch
          git diff --check

      - name: Validate changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v4-canonical/lanes.js
          node --check src/judgment-materials-analyzer.js
          node --check src/deterministic-task-decomposer.js
          node --check src/canonical-astera-engine-base.js
          node --check src/canonical-astera-engine.js
          node --check test/engine.test.js
          node --check test/task-decomposition-canon-regression.test.js

      - name: Validate judgment-material focused suite
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/all-domain-router.test.js \
            test/canonical-composition-boundary.test.js \
            test/canonical-concurrency-limit.test.js \
            test/canonical-decision-materials-load.test.js \
            test/canonical-entrypoint-regression.test.js \
            test/canonical-lens-evidence-regression.test.js \
            test/canonical-main8-trace.test.js \
            test/canonical-parallel-execution.test.js \
            test/canonical-runtime-flow-regression.test.js \
            test/canonical-v4-pipeline-regression.test.js \
            test/canonical-worker-boundaries.test.js \
            test/engine.test.js \
            test/evidence-binding-scope-regression.test.js \
            test/false-confirmation-effect.test.js \
            test/global-input-understanding.test.js \
            test/human-reader-effect-boundary.test.js \
            test/lens-output-integration.test.js \
            test/lens-plan-integration.test.js \
            test/purpose-effect-story.test.js \
            test/request-abort-context.test.js \
            test/task-decomposition-canon-regression.test.js \
            test/task-decomposition-v2-regression.test.js \
            test/task-target-lens-regression.test.js \
            test/v4-canonical-fidelity.test.js \
            test/v4-source-span-regression.test.js

      - name: Commit verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-verified-lens-perspective-fix.yml
          git add \
            src/v4-canonical/lanes.js \
            src/judgment-materials-analyzer.js \
            src/deterministic-task-decomposer.js \
            src/canonical-astera-engine-base.js \
            src/canonical-astera-engine.js \
            test/engine.test.js \
            test/task-decomposition-canon-regression.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: converge judgment materials module"
          git push origin HEAD:feature/evidence-search-v2-4
