name: Evidence Dual Lane Live Smoke

on:
  push:
    branches:
      - main
    paths:
      - "src/evidence-search/**"
      - "config/evidence-providers.public.json"
      - "config/evidence-source-catalog.public.json"
      - "config/evidence-kb-targets.public.tsv"
      - "scripts/evidence-dual-lane-live-smoke.js"
      - ".github/workflows/evidence-dual-lane-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-dual-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run specialist KB + current web live Evidence smoke
        run: node scripts/evidence-dual-lane-live-smoke.js
