name: Astera Legacy TGserver Log Read

on:
  push:
    branches:
      - fix/flow-recovery-convergence-20261001
    paths:
      - .github/astera-legacy-tgserver-query.json
      - .github/workflows/astera-legacy-tgserver-log-read.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-legacy-tgserver-log-read
  cancel-in-progress: true

jobs:
  read-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEGACY_TGSERVER_URL: ${{ vars.LEGACY_TGSERVER_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.LEGACY_TGSERVER_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.LEGACY_TGSERVER_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate search request
        id: config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const q = JSON.parse(fs.readFileSync('.github/astera-legacy-tgserver-query.json','utf8'));
          const allowed = ['query','project_id','severity','from','to','source','repo','branch','workflow','run_id','module'];
          for (const key of Object.keys(q)) if (!allowed.includes(key)) throw new Error(`UNKNOWN_QUERY_FIELD:${key}`);
          if (typeof q.query !== 'string' || q.query.length > 1024) throw new Error('INVALID_QUERY');
          for (const key of allowed.filter((value) => value !== 'query')) {
            if (q[key] !== null && q[key] !== undefined && typeof q[key] !== 'string') throw new Error(`INVALID_${key}`);
          }
          if (q.project_id && !/^P\d+$/.test(q.project_id)) throw new Error('INVALID_PROJECT_ID');
          const body = {};
          for (const key of allowed) if (q[key] !== null && q[key] !== undefined && q[key] !== '') body[key] = q[key];
          if (!('query' in body)) body.query = '';
          fs.writeFileSync('astera-tgserver-search-request.json', JSON.stringify(body));
          console.log(`SEARCH_FILTER_KEYS=${Object.keys(body).join(',')}`);
          NODE
          if [ -z "${LEGACY_TGSERVER_URL:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "LEGACY_TGSERVER_URL_CONFIGURED=FALSE"
            exit 0
          fi
          node <<'NODE'
          const value = String(process.env.LEGACY_TGSERVER_URL || '').trim();
          const url = new URL(value);
          if (url.protocol !== 'https:') throw new Error('LEGACY_TGSERVER_URL_MUST_USE_HTTPS');
          const allowed = url.hostname === 'asterav8.jp' || url.hostname.endsWith('.asterav8.jp');
          if (!allowed) throw new Error('LEGACY_TGSERVER_URL_HOST_NOT_ALLOWED');
          NODE
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "LEGACY_TGSERVER_URL_CONFIGURED=TRUE"

      - name: Search legacy TGserver
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${LEGACY_TGSERVER_URL%/}"
          base="${base%/ingest}"
          args=(--silent --show-error --connect-timeout 5 --max-time 20 -H 'accept: application/json')
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ]; then args+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"); fi
          if [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then args+=(-H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"); fi
          health_code="$(curl "${args[@]}" -o /tmp/tgs-health.json -w '%{http_code}' "$base/health")"
          echo "LEGACY_TGSERVER_HEALTH_HTTP=$health_code"
          [[ "$health_code" =~ ^2[0-9][0-9]$ ]]
          search_code="$(curl "${args[@]}" -H 'content-type: application/json' --data-binary @astera-tgserver-search-request.json -o /tmp/tgs-search-raw.json -w '%{http_code}' "$base/search")"
          echo "LEGACY_TGSERVER_SEARCH_HTTP=$search_code"
          [[ "$search_code" =~ ^2[0-9][0-9]$ ]]
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/tgs-search-raw.json','utf8'));
          const forbidden = /(authorization|cookie|api[_-]?key|secret|password|private[_-]?key|access[_-]?token|refresh[_-]?token)/i;
          function scrub(v) {
            if (v == null) return v;
            if (typeof v === 'string') return v.replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]').replace(/(?:api[_-]?key|secret|password|token)\s*[:=]\s*\S+/gi,(m)=>m.split(/[:=]/)[0]+'=[REDACTED]');
            if (Array.isArray(v)) return v.map(scrub);
            if (typeof v === 'object') {
              const out = {};
              for (const [k,x] of Object.entries(v)) out[k] = forbidden.test(k) ? '[REDACTED]' : scrub(x);
              return out;
            }
            return v;
          }
          const safe = scrub(raw);
          fs.writeFileSync('astera-legacy-tgserver-log-read.json', JSON.stringify(safe, null, 2));
          const hits = Array.isArray(raw?.hits) ? raw.hits.length : 0;
          console.log(`LEGACY_TGSERVER_HIT_COUNT=${hits}`);
          NODE
          rm -f /tmp/tgs-health.json /tmp/tgs-search-raw.json astera-tgserver-search-request.json

      - name: Upload sanitized readback
        if: steps.config.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-legacy-tgserver-log-read-${{ github.run_id }}
          path: astera-legacy-tgserver-log-read.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "TGSERVER_GENERATION=LEGACY_ONLY"
          echo "SEARCH_API=POST_/search"
          echo "TOPIC_ID_FIXED=FALSE"
          echo "PROJECT_ID_FIXED_BY_WORKFLOW=FALSE"
          echo "SEARCHABLE_METADATA=source,repo,branch,workflow,run_id,module"
          echo "VNEXT_USED=FALSE"
          echo "READ_ONLY=TRUE"
