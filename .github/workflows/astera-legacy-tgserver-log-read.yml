name: Astera Legacy TGserver Log Read

on:
  push:
    branches:
      - fix/flow-recovery-convergence-20261001
    paths:
      - .github/astera-legacy-tgserver-query.json
      - .github/workflows/astera-legacy-tgserver-log-read.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEGACY_TGSERVER_URL: ${{ vars.LEGACY_TGSERVER_URL }}
      ASTERA_TGS_DEVELOPMENT_PROJECT_ID: ${{ vars.ASTERA_TGS_DEVELOPMENT_PROJECT_ID }}
      ASTERA_TGS_KB_PROJECT_ID: ${{ vars.ASTERA_TGS_KB_PROJECT_ID }}
      ASTERA_TGS_SYSTEM_PROJECT_ID: ${{ vars.ASTERA_TGS_SYSTEM_PROJECT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.LEGACY_TGSERVER_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.LEGACY_TGSERVER_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve query
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LEGACY_TGSERVER_URL:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "LEGACY_TGSERVER_URL_CONFIGURED=FALSE"
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const q = JSON.parse(fs.readFileSync('.github/astera-legacy-tgserver-query.json','utf8'));
          const modules = {
            development: process.env.ASTERA_TGS_DEVELOPMENT_PROJECT_ID,
            kb: process.env.ASTERA_TGS_KB_PROJECT_ID,
            system: process.env.ASTERA_TGS_SYSTEM_PROJECT_ID,
          };
          if (!Object.hasOwn(modules, q.module)) throw new Error('INVALID_MODULE');
          const project = String(modules[q.module] || '').trim();
          if (!/^P\d+$/.test(project)) throw new Error(`PROJECT_ID_NOT_CONFIGURED_FOR_${q.module}`);
          const url = new URL(process.env.LEGACY_TGSERVER_URL);
          if (url.protocol !== 'https:') throw new Error('LEGACY_TGSERVER_URL_MUST_USE_HTTPS');
          const allowed = url.hostname === 'asterav8.jp' || url.hostname.endsWith('.asterav8.jp');
          if (!allowed) throw new Error('LEGACY_TGSERVER_URL_HOST_NOT_ALLOWED');
          const severities = new Set(['','error','warn','info','debug','trace']);
          if (!severities.has(String(q.severity || ''))) throw new Error('INVALID_SEVERITY');
          const limit = Number(q.limit ?? 100);
          if (!Number.isInteger(limit) || limit < 1 || limit > 100) throw new Error('INVALID_LIMIT');
          fs.writeFileSync('/tmp/tgs-query.json', JSON.stringify({
            query: String(q.query || ''),
            project_id: project,
            ...(q.severity ? {severity:q.severity}:{}),
            ...(q.from ? {from:q.from}:{}),
            ...(q.to ? {to:q.to}:{}),
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `module=${q.module}\nproject=${project}\nlimit=${limit}\n`);
          NODE
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Search legacy TGserver
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${LEGACY_TGSERVER_URL%/}"
          base="${base%/ingest}"
          args=(--silent --show-error --connect-timeout 5 --max-time 20 -H 'accept: application/json')
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ]; then args+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"); fi
          if [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then args+=(-H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"); fi
          health_code="$(curl "${args[@]}" -o /tmp/tgs-health.json -w '%{http_code}' "$base/health")"
          echo "LEGACY_TGSERVER_HEALTH_HTTP=$health_code"
          [[ "$health_code" =~ ^2[0-9][0-9]$ ]]
          code="$(curl "${args[@]}" -H 'content-type: application/json' --data-binary @/tmp/tgs-query.json -o /tmp/tgs-result.json -w '%{http_code}' "$base/search")"
          echo "LEGACY_TGSERVER_SEARCH_HTTP=$code"
          [[ "$code" =~ ^2[0-9][0-9]$ ]]

      - name: Sanitize search result
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/tgs-result.json','utf8'));
          const forbidden = /(authorization|cookie|api[_-]?key|secret|password|private[_-]?key|access[_-]?token|refresh[_-]?token)/i;
          function scrub(v) {
            if (v == null) return v;
            if (typeof v === 'string') return v.replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]').replace(/(?:api[_-]?key|secret|password|token)\s*[:=]\s*\S+/gi,(m)=>m.split(/[:=]/)[0]+'=[REDACTED]');
            if (Array.isArray(v)) return v.map(scrub);
            if (typeof v === 'object') { const o={}; for (const [k,x] of Object.entries(v)) o[k]=forbidden.test(k)?'[REDACTED]':scrub(x); return o; }
            return v;
          }
          const hits = Array.isArray(raw?.hits) ? raw.hits : [];
          const limit = Number('${{ steps.config.outputs.limit }}');
          const out = {
            schema: 'astera.legacy-tgserver-read/v1',
            module: '${{ steps.config.outputs.module }}',
            project_id: '${{ steps.config.outputs.project }}',
            repository: process.env.GITHUB_REPOSITORY,
            run_id: process.env.GITHUB_RUN_ID,
            retrieved_at: new Date().toISOString(),
            hit_count: hits.length,
            hits: scrub(hits.slice(0, limit)),
          };
          fs.writeFileSync('astera-legacy-tgserver-log-read.json', JSON.stringify(out,null,2));
          console.log(`LEGACY_TGSERVER_HIT_COUNT=${hits.length}`);
          NODE

      - name: Upload sanitized readback
        if: steps.config.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: astera-legacy-tgserver-log-read-${{ github.run_id }}
          path: astera-legacy-tgserver-log-read.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Summary
        if: always()
        run: |
          echo "TGSERVER_GENERATION=LEGACY_ONLY"
          echo "TOPIC_ID_FIXED=FALSE"
          echo "PROJECT_ID_SOURCE=GITHUB_VARIABLES"
          echo "READ_ONLY=TRUE"
