name: Evidence Search Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [feature/evidence-search-v2-4]
    paths:
      - 'src/evidence-search/providers/**'
      - 'config/evidence-providers.public.json'
      - 'docker-compose.evidence.yml'
      - 'scripts/evidence-live-smoke.js'
      - 'test/evidence-search-provider-adapter.test.js'
      - '.github/workflows/evidence-search.yml'

permissions:
  contents: read

jobs:
  evidence-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify free evidence search module
        id: verify
        continue-on-error: true
        run: npm run verify:evidence > evidence-verification.log 2>&1

      - name: Verify real public specialist retrieval
        id: live
        continue-on-error: true
        run: node scripts/evidence-live-smoke.js > evidence-live-search.log 2>&1

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verification-log
          path: |
            evidence-verification.log
            evidence-live-search.log
          if-no-files-found: error
          retention-days: 7

      - name: Print verification failure
        if: steps.verify.outcome == 'failure'
        run: cat evidence-verification.log

      - name: Print live search result
        if: always()
        run: cat evidence-live-search.log

      - name: Stop after verification failure
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Stop after live search failure
        if: steps.live.outcome == 'failure'
        run: exit 1
