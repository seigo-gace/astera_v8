name: One-time Astera canonical import into isolation

on:
  push:
    branches:
      - isolation/drive-canonical-wip
    paths:
      - .staginghex/READY

permissions:
  contents: write

concurrency:
  group: astera-isolation-canonical-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create four canonical commits without clone or checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: isolation/drive-canonical-wip
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tarfile
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          trigger_sha = os.environ['TRIGGER_SHA']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def call(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          ref = call('GET', f'/git/ref/heads/{branch}')
          if ref['object']['sha'] != trigger_sha:
              raise SystemExit('Isolation branch moved before import started')

          trigger_commit = call('GET', f'/git/commits/{trigger_sha}')
          trigger_tree = call('GET', f"/git/trees/{trigger_commit['tree']['sha']}?recursive=1")
          if trigger_tree.get('truncated'):
              raise SystemExit('Staging tree listing was truncated')

          part_items = sorted(
              (item for item in trigger_tree['tree'] if item.get('type') == 'blob' and item['path'].startswith('.staginghex/release.part')),
              key=lambda item: item['path'],
          )
          if not part_items:
              raise SystemExit('No release payload parts found')

          hex_parts = []
          for item in part_items:
              blob = call('GET', f"/git/blobs/{item['sha']}")
              raw = base64.b64decode(blob['content']) if blob.get('encoding') == 'base64' else blob['content'].encode()
              hex_parts.append(raw.decode('ascii').strip())

          archive_bytes = bytes.fromhex(''.join(hex_parts))
          extract_root = Path('/tmp/astera-release')
          extract_root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (extract_root / member.name).resolve()
                  if extract_root.resolve() not in target.parents and target != extract_root.resolve():
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              archive.extractall(extract_root)

          files = sorted(path for path in extract_root.rglob('*') if path.is_file())
          if len(files) < 200:
              raise SystemExit(f'Canonical payload is incomplete: {len(files)} files')

          def group_for(rel: str) -> int:
              first = PurePosixPath(rel).parts[0]
              if first == 'src':
                  parts = PurePosixPath(rel).parts
                  if len(parts) > 1 and parts[1] in {'evidence-search', 'quality-completion-evaluator', 'runtime'}:
                      return 3
                  return 2
              if first in {'test', 'tests', 'e2e', 'scripts', 'archive'}:
                  return 4
              return 1

          groups = {1: [], 2: [], 3: [], 4: []}
          for path in files:
              rel = path.relative_to(extract_root).as_posix()
              groups[group_for(rel)].append((rel, path))

          messages = {
              1: 'chore(isolation): import Astera release foundation',
              2: 'feat(isolation): import Astera core implementation',
              3: 'feat(isolation): import Astera runtime modules',
              4: 'test(isolation): import Astera tests and archive',
          }

          parent_sha = trigger_sha
          base_tree_sha = None
          created = []
          for number in (1, 2, 3, 4):
              entries = []
              for rel, path in groups[number]:
                  blob = call('POST', '/git/blobs', {
                      'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                      'encoding': 'base64',
                  })
                  entries.append({'path': rel, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              tree_payload = {'tree': entries}
              if base_tree_sha:
                  tree_payload['base_tree'] = base_tree_sha
              tree = call('POST', '/git/trees', tree_payload)
              commit = call('POST', '/git/commits', {
                  'message': messages[number],
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              })
              created.append({'group': number, 'commit': commit['sha'], 'files': len(entries)})
              parent_sha = commit['sha']
              base_tree_sha = tree['sha']

          call('PATCH', f'/git/refs/heads/{branch}', {'sha': parent_sha, 'force': False})
          print(json.dumps({'final_commit': parent_sha, 'commits': created, 'total_files': len(files)}, indent=2))
          PY
