name: Generate Astera Homepage Examples

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/astera-homepage-examples.yml"
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  generate-examples:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN_ASTERA_HOMEPAGE_EXAMPLES'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm GitHub CLI
        run: |
          gh --version
          gh auth status
          gh repo view "$GH_REPO"
          echo "GH_READY"

      - name: Run Astera and generate homepage examples
        run: |
          node <<'NODE'
          'use strict';

          const fs = require('node:fs');
          const path = require('node:path');
          const KaguraEngine = require('./src/kagura-engine');

          const samples = [
            {
              id: 'solo-saas-launch',
              title: '一人で運営する新規SaaSの公開判断',
              question: `私は開発・営業・問い合わせ対応を一人で行っています。中小事業者向けに、社内資料やFAQを登録するとAIが質問へ回答する月額制Webサービスを公開したいです。初期予算は30万円、毎月の固定費上限は5万円、公開まで6週間です。無料利用者には月20回、有料利用者には月500回まで回答させる案を考えていますが、料金はまだ決めていません。個人情報や機密資料を扱う可能性があり、誤回答が顧客業務へ影響する危険もあります。私は問い合わせ対応へ時間を取られたくありませんが、初月から売上を作りたいです。機能を減らしただけの簡易版ではなく、必要機能を保ったまま運用負担とコストを抑えたいです。公開前に何を決め、どの順番で進め、どの条件を満たしたら販売開始してよいか、現実的な計画を判断してください。`,
              context: `対象: 日本の小規模事業者。運営者: 1名。予算: 初期30万円、固定費月5万円以内。期限: 6週間。成功条件: 初月に有料契約を獲得し、重大な情報漏えい・誤回答事故を起こさず、問い合わせ対応を週3時間以内に抑える。禁止: 個人情報を無制限に保存すること、未検証機能を完成扱いすること、無料枠による赤字拡大。`,
              moodAnswers: { good: true, urgent: true, deepThink: true }
            },
            {
              id: 'customer-support-ai',
              title: '問い合わせを減らす顧客対応AIの導入判断',
              question: `月300件ほど届く問い合わせを、Notionに蓄積した製品情報とFAQを使う顧客対応AIで減らしたいです。現在は私一人で返信しており、同じ質問が多い一方、料金、解約、障害、返金、個人情報、技術仕様など誤案内すると問題になる内容も含まれます。AIには単なるFAQ検索ではなく、追加質問にも答え、利用者が理解できる説明を返してほしいです。ただし、分からない内容をもっともらしく断定したり、未実装機能を案内したり、契約や法的判断を勝手に確定してはいけません。3週間以内に公開し、問い合わせの70％をAIだけで完結させ、私が確認する案件を重要なものだけに絞りたいです。KBの構造、回答可否の判断、有人対応への切替条件、公開前の検証、運用開始後の改善方法まで含めて、最も安全で効果の高い導入方法を設計してください。`,
              context: `現状: 月300件、運営1名、Notion KBあり。期限: 3週間。目標: 自動完結70%、重大誤案内0件、有人確認対象を明確化。必要領域: 製品説明、料金、解約、返金、障害、技術、個人情報、追加質問。制約: 未実装情報は回答禁止、根拠を追跡可能にする、回答不能時は適切に引き継ぐ。`,
              moodAnswers: { good: true, urgent: false, deepThink: true }
            },
            {
              id: 'crowdfunding-plan',
              title: '開発中サービスのクラウドファンディング計画',
              question: `ほぼ動く状態まで開発したAI支援サービスの運用資金を集めるため、CAMPFIREで3か月・目標300万円のクラウドファンディングを行いたいです。私は現在ほぼ無収入で、早期に資金が必要です。一方で、まだ一般公開前なので、完成済みと誤解させる表現や、提供できない機能を約束することは避けたいです。支援者向けリターンだけでなく、継続的な開発支援、スポンサー、事業提携、投資家への導線も並行して作りたいですが、それぞれの契約や見返りを混同して規約や法律上の問題を起こしたくありません。開発者一人でも履行でき、支援者に魅力が伝わり、公開後の運用負担が破綻しない募集構成、見せ方、リターン、資金用途、リスク説明、募集期間中の更新計画を判断してください。`,
              context: `サービス: AIを置き換えず判断材料を加える外付け認知支援基盤。開発状態: API中心に概ね稼働、一般向け提供方法は整備中。募集: CAMPFIRE、3か月、目標300万円。運営: 1名。目的: 開発・運用資金の確保。併設導線: 個人支援、スポンサー、事業提携、投資家。制約: 実現不能な約束禁止、各支援区分を混同しない、履行負担を抑える。`,
              moodAnswers: { good: true, urgent: true, deepThink: true }
            },
            {
              id: 'production-migration',
              title: '小規模サーバーでの本番移行判断',
              question: `現在1台のVPSで動いているAPIを、Cloudflareを入口にし、内部処理は3 vCPU・4GBメモリ・50GBストレージのVPSで継続運用する構成へ整理したいです。公開停止は最大5分まで、利用者データの消失は許容できません。ログは外部のTGserverへ送り、VPS内には短期キャッシュだけを残します。Dockerを使いますが、監視、バックアップ、ロールバック、レート制限、秘密情報、障害時の再送など未整理の部分があります。機能を増やすことが目的ではなく、必要な機能を保ったまま重複や無駄をなくし、限られた資源で安全に高速化したいです。移行方式を複数比較し、採用すべき構成、移行手順、失敗時の戻し方、公開判定条件を具体的に判断してください。`,
              context: `現行: 単一VPS。目標: Cloudflare公開入口 + VPS内部処理。資源: 3 vCPU、4GB RAM、50GB。停止許容: 5分以内。RPO: 0を目標。ログ: TGserver。実行: Docker。必要事項: 監視、バックアップ、ロールバック、Rate Limit、Secret管理、再送、容量上限。禁止: 未検証移行、データ消失、無関係な重量コンポーネント追加。`,
              moodAnswers: { good: true, urgent: false, deepThink: true }
            }
          ];

          function safe(value) {
            return String(value ?? '-').replace(/\r/g, '').trim() || '-';
          }

          function sectionValue(key, section = {}) {
            if (key === '01_purpose') return section.text || '-';
            if (key === '02_premise') return (section.items || []).join(' / ') || '-';
            if (key === '03_facts') return section.summary || '-';
            if (key === '04_crisis') return section.summary || '-';
            if (key === '05_opposition') return section.summary || '-';
            if (key === '06_comparison') return section.summary || '-';
            if (key === '07_recommendation') return [section.summary, section.reason].filter(Boolean).join(' / ') || '-';
            if (key === '08_reinstruction') return (section.items || []).join(' / ') || '-';
            return section.summary || '-';
          }

          async function main() {
            const engine = new KaguraEngine({ poolSize: 4 });
            const outputs = [];
            try {
              for (const sample of samples) {
                const response = await engine.process({
                  question: sample.question,
                  context: sample.context,
                  outputLanguage: 'ja',
                  moodAnswers: sample.moodAnswers
                }, { id: `homepage-${sample.id}` });

                const judgment = response.result?.judgment || {};
                const comparison = response.result?.comparison || {};
                const domain = response.result?.domain || {};
                outputs.push({
                  ...sample,
                  resultType: response.result?.type || null,
                  runtimeMode: response.result?.mode || null,
                  primaryDomain: domain.primary || null,
                  overlays: domain.overlays || [],
                  score: comparison.score ?? null,
                  answerLineDistance: comparison.answer_line_distance ?? null,
                  decision: comparison.verdict?.decision || null,
                  selectedCandidate: comparison.selected_candidate || null,
                  candidateRanking: comparison.candidate_ranking || [],
                  compactMaterial: response.material?.compact_text || '',
                  sections: (judgment.order || []).map((key) => ({
                    key,
                    label: judgment[key]?.label || key,
                    value: sectionValue(key, judgment[key]),
                    passToMainAI: judgment[key]?.pass_to_main_ai || []
                  }))
                });
              }
            } finally {
              await engine.destroy();
            }

            const lines = [
              '# Astera v8｜ホームページ掲載用 実行結果',
              '',
              '> このファイルは `seigo-gace/astera_v8` の現行RuntimeをGitHub Actions上で実行して生成した記録です。文章例を手作業でAstera風に整えたものではありません。',
              '',
              `- Source workflow commit: ${process.env.GITHUB_SHA || 'unknown'}`,
              '- Runtime: Astera v8 / Hyperion Max Firepower',
              '- Output language: Japanese',
              `- Samples: ${outputs.length}`,
              ''
            ];

            for (const [index, output] of outputs.entries()) {
              lines.push(
                '---',
                '',
                `## ${index + 1}. ${output.title}`,
                '',
                '### 入力した相談',
                '',
                output.question,
                '',
                '### 与えた前提・制約',
                '',
                output.context,
                '',
                '### Astera実行判定',
                '',
                `- result_type: ${safe(output.resultType)}`,
                `- runtime_mode: ${safe(output.runtimeMode)}`,
                `- domain: ${safe(output.primaryDomain?.name || output.primaryDomain?.id)}`,
                `- overlays: ${output.overlays.map((item) => item.name || item.id).join(' / ') || 'なし'}`,
                `- score: ${safe(output.score)}`,
                `- answer_line_distance: ${safe(output.answerLineDistance)}`,
                `- decision: ${safe(output.decision)}`,
                `- selected_candidate: ${safe(output.selectedCandidate?.label || output.selectedCandidate?.id)}`,
                '',
                '### Asteraが生成した判断素材8項目',
                ''
              );

              for (const section of output.sections) {
                lines.push(
                  `#### ${section.label}`,
                  '',
                  safe(section.value),
                  '',
                  '**主役AIへ渡す観点**',
                  '',
                  ...(section.passToMainAI.length ? section.passToMainAI.map((item) => `- ${safe(item)}`) : ['- なし']),
                  ''
                );
              }

              lines.push(
                '### Asteraのコンパクト出力（実出力）',
                '',
                '```text',
                output.compactMaterial,
                '```',
                ''
              );
            }

            const destination = path.join('docs', 'homepage', 'astera-response-examples.md');
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.writeFileSync(destination, `${lines.join('\n')}\n`, 'utf8');
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit generated execution record
        run: |
          if git diff --quiet -- docs/homepage/astera-response-examples.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/homepage/astera-response-examples.md
          git commit -m "docs: generate Astera homepage response examples"
          git push

      - name: Close trigger issue
        if: github.event_name == 'issues'
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "Astera homepage examples generated."
