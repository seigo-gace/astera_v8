name: Build Judgment Materials Server Candidate

on:
  push:
    branches:
      - deploy-candidate/judgment-materials-f15c016

permissions:
  contents: write

concurrency:
  group: judgment-materials-server-candidate
  cancel-in-progress: false

jobs:
  build-verify-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical product repairs without out-of-scope Evidence server/CI changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/.judgment-materials-repair.py')
          s = p.read_text()
          start = s.index('# Integrated boundary:')
          end = s.index('# Strengthen Main8 Lens test')
          s = s[:start] + s[end:]
          if '# Focused CI:' in s:
              s = s.split('# Focused CI:')[0] + "\nprint('candidate broad repair applied')\n"
          p.write_text(s)
          PY
          python scripts/.judgment-materials-repair-runner.py
          python scripts/.server-candidate-hardening.py

      - name: Verify dependency closure and canonical data completeness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const forbidden = [
            'src/evidence-search/',
            'src/quality-completion-evaluator/',
            'src/server-with-evidence.js',
            'src/server-with-module-switch.js',
            'src/astera-module-switch.js'
          ];
          const closure = new Set();
          function rel(p){ return path.relative(root,p).replaceAll('\\','/'); }
          function resolveLocal(from, spec){
            const base = path.resolve(path.dirname(from), spec);
            for (const candidate of [base, `${base}.js`, `${base}.json`, path.join(base,'index.js')]) {
              if (fs.existsSync(candidate) && fs.statSync(candidate).isFile()) return candidate;
            }
            throw new Error(`MISSING_LOCAL_DEPENDENCY ${rel(from)} -> ${spec}`);
          }
          function visit(file){
            const r = rel(file);
            if (closure.has(r)) return;
            if (forbidden.some((item)=>r===item || r.startsWith(item))) throw new Error(`FORBIDDEN_DEPENDENCY ${r}`);
            closure.add(r);
            if (!r.endsWith('.js')) return;
            const text = fs.readFileSync(file,'utf8');
            for (const m of text.matchAll(/require\(\s*['"](\.[^'"]+)['"]\s*\)/g)) visit(resolveLocal(file,m[1]));
          }
          visit(path.join(root,'src/kagura-engine.js'));
          if (!fs.existsSync('src/canonical-task-worker.js')) throw new Error('dynamic canonical worker missing');
          visit(path.join(root,'src/canonical-task-worker.js'));
          fs.writeFileSync('/tmp/judgment-closure.txt',[...closure].sort().join('\n')+'\n');
          console.log(`closure_files=${closure.size}`);
          console.log([...closure].sort().join('\n'));
          NODE
          node <<'NODE'
          const { GENRE_LENSES } = require('./src/all-domain-lens-catalog');
          const ids = GENRE_LENSES.map((x)=>x.id);
          const expected = Array.from({length:38},(_,i)=>`G${String(i+1).padStart(2,'0')}`);
          if (ids.length !== 38) throw new Error(`lens_count=${ids.length}`);
          for (const id of expected) if (!ids.includes(id)) throw new Error(`missing_lens=${id}`);
          console.log(`lens_catalog=PASS count=${ids.length}`);
          NODE
          for f in \
            src/v4-canonical/claim-extractor.js \
            src/v4-canonical/code-structure-parser.js \
            src/v4-canonical/confirmation.js \
            src/v4-canonical/core.js \
            src/v4-canonical/evidence-binding.js \
            src/v4-canonical/fragmenter.js \
            src/v4-canonical/lanes.js \
            src/v4-canonical/policy-registry.js \
            src/v4-canonical/query-planner.js; do
              test -f "$f" || { echo "missing canonical data/code: $f" >&2; exit 1; }
          done

      - name: Syntax and no-shortcut static audit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            case "$f" in *.js) node --check "$f" ;; esac
          done </tmp/judgment-closure.txt
          node --check test/judgment-materials-no-shortcuts-regression.test.js
          node --check test/judgment-materials-server-candidate.test.js
          node --check test/task-decomposition-canon-regression.test.js
          node --check test/task-decomposition-v2-regression.test.js
          node --check test/lens-output-integration.test.js
          node --check test/canonical-main8-trace.test.js
          ! grep -RniE '\b(TODO|FIXME|DUMMY|PLACEHOLDER|MOCK|STUB)\b' $(cat /tmp/judgment-closure.txt) || { echo 'placeholder marker found in active judgment closure' >&2; exit 1; }
          ! grep -RniE 'context_length=' src/canonical-astera-engine-base.js
          ! grep -RniE 'canonicalClaimRecordsByTask|canonical_claim_records_by_task|providedCanonical\[task\.id\]' src/canonical-astera-engine-base.js src/canonical-astera-engine.js

      - name: Canonical adversarial and regression tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s node --test \
            test/judgment-materials-no-shortcuts-regression.test.js \
            test/judgment-materials-server-candidate.test.js \
            test/all-domain-router.test.js \
            test/canonical-concurrency-limit.test.js \
            test/canonical-decision-materials-load.test.js \
            test/canonical-lens-evidence-regression.test.js \
            test/canonical-main8-trace.test.js \
            test/canonical-parallel-execution.test.js \
            test/canonical-runtime-flow-regression.test.js \
            test/canonical-v4-pipeline-regression.test.js \
            test/canonical-worker-boundaries.test.js \
            test/engine.test.js \
            test/global-input-understanding.test.js \
            test/lens-output-integration.test.js \
            test/lens-plan-integration.test.js \
            test/task-decomposition-canon-regression.test.js \
            test/task-decomposition-v2-regression.test.js

      - name: Existing server API compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s node --test test/api.test.js test/security.test.js

      - name: Deterministic runtime readback before packaging
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const Engine = require('./src/kagura-engine');
          const logger={write(){},async flush(){}};
          (async()=>{
            const engine=new Engine({poolSize:1,logger});
            try{
              const input={question:'A案とB案を費用と安全性で比較し、採用判断に必要な材料を出す。最終判断はするな。',context:'Asteraは判断材料だけを生成する。mainは変更しない。'};
              const a=await engine.process(input,{id:'determinism'});
              const b=await engine.process(input,{id:'determinism'});
              assert.deepEqual(a.result,b.result);
              assert.equal(a.result.decision_authority,'EXTERNAL_ONLY');
              assert.equal(a.result.comparison.material_only,true);
              assert.equal(a.result.comparison.selected_candidate,null);
              assert.deepEqual(a.result.comparison.candidate_ranking,[]);
              assert.equal(Object.hasOwn(a.result.comparison,'score'),false);
              assert.equal(a.result.judgment.order[6],'07_evidence_status');
              assert.ok(a.result.analysis_task_packet.tasks.every((task)=>task.action!=='decide'));
              console.log('deterministic_runtime=PASS');
            } finally { await engine.destroy(); }
          })().catch((e)=>{console.error(e);process.exit(1)});
          NODE

      - name: Docker packaging check using unchanged server-base Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          docker build -t astera-judgment-candidate:${GITHUB_SHA} .
          docker run --rm --entrypoint node astera-judgment-candidate:${GITHUB_SHA} -e "const assert=require('node:assert/strict');const E=require('./src/kagura-engine');(async()=>{const e=new E({poolSize:1,logger:{write(){},async flush(){}}});try{const o=await e.process({question:'APIを検証する。'},{id:'container'});assert.equal(o.result.decision_authority,'EXTERNAL_ONLY');assert.equal(o.result.comparison.material_only,true);console.log('container_engine=PASS')}finally{await e.destroy()}})().catch(x=>{console.error(x);process.exit(1)})"

      - name: Remove all temporary repair/carrier files and enforce final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/.judgment-materials-repair.py \
            scripts/.judgment-materials-repair-runner.py \
            scripts/.server-candidate-hardening.py \
            .github/workflows/build-judgment-server-candidate.yml
          git add -A
          test ! -e scripts/.judgment-materials-repair.py
          test ! -e scripts/.judgment-materials-repair-runner.py
          test ! -e scripts/.server-candidate-hardening.py
          test ! -e .github/workflows/build-judgment-server-candidate.yml
          changed=$(git diff --cached --name-only f15c016e203ccc82f55f2e229ce084d2a52d05a3)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(src/evidence-search/|src/quality-completion-evaluator/|src/server-with-evidence\.js$|src/server-with-module-switch\.js$|src/astera-module-switch\.js$|src/server\.js$|start\.js$|Dockerfile$|docker-compose|\.env|config/)'; then
            echo 'OUT_OF_SCOPE_PATH_IN_FINAL_DIFF' >&2; exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '^\.github/workflows/|^scripts/\.judgment|^scripts/\.server-candidate'; then
            echo 'TEMP_FILE_IN_FINAL_DIFF' >&2; exit 1
          fi
          git diff --cached --check

      - name: Commit verified deploy candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ASTERA Controlled Candidate Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: add standalone canonical judgment materials server candidate'
          git push origin HEAD:${GITHUB_REF_NAME}
