name: Universal Structure Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run universal corpus and source-graph contracts
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/universal-structure-v1
          node --test test/universal-judgment-corpus-contract.test.js test/universal-source-graph.test.js > artifacts/universal-structure-v1/test.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > artifacts/universal-structure-v1/exit-code.txt
          exit "$rc"

      - name: Upload universal structure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-structure-v1-${{ github.sha }}
          path: artifacts/universal-structure-v1
          if-no-files-found: error
          retention-days: 14

      - name: Enforce universal structure contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc="$(cat artifacts/universal-structure-v1/exit-code.txt 2>/dev/null || printf '2')"
          if [ "$rc" != "0" ]; then
            cat artifacts/universal-structure-v1/test.log || true
            exit "$rc"
          fi
