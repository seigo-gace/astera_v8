services:
  astera-quality-completion-evaluator:
    build: .
    image: astera-quality-completion-evaluator:1.0.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    stdin_open: true
    network_mode: none
